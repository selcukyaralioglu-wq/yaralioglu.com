# Build static Next.js site and upload to Hostinger via FTP.
# Setup: GitHub repo → Settings → Secrets → Actions → add FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# If FTP opens inside public_html already, keep server-dir as ./ ; otherwise try ./public_html/

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        env:
          NEXT_PUBLIC_SITE_URL: https://yaralioglu.com
        run: |
          npm ci
          npm run build

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          # Many Hostinger FTP users are jailed to public_html → use ./
          server-dir: ./
